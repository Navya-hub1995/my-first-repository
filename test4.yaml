name: file operations in github

on: workflow_dispatch

jobs:
    files:
        runs-on: ubuntu-latest
        steps:
            -name: create a one file
             run: echo "devops 12345" > devops.txt

            -name: display the content of a file
             run: cat devops.txt

            -name: display the date
             run: date

            -name: display files and dir
             run: ls _lrth

             -name: display the present location
              run: pwd